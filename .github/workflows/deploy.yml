name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ "AIzaSyDFWBa-XQ5Ppz8aAcChO8U5uWQ5gMRrBRM"}}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ "livingstoneedu-1ef57.firebaseapp.com" }}
          VITE_FIREBASE_PROJECT_ID: ${{ "livingstoneedu-1ef57" }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{"livingstoneedu-1ef57.firebasestorage.app" }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{"862725103424"}}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{"G-MLJ844W1NY"}}
          VITE_FIREBASE_DATABASE_URL: ${{ "https://livingstoneedu-1ef57-default-rtdb.firebaseio.com" }}

      - name: Create 404.html for SPA fallback routing
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
